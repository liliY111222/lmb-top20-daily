name: Update lithium-metal battery papers

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate page
        run: python scripts/lmb_top20_daily.py --days 90 --max-results 120 --output .

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update lithium-metal battery papers"
          file_pattern: "index.html papers.json"

      - name: Publish gh-pages branch
        run: git push origin HEAD:gh-pages
